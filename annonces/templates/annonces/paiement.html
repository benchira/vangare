{% extends 'annonces/base.html' %}
{% block content %}
<div class="card">
    <h2>Choisir un mode de paiement</h2>
    <p class="muted">Le cash on delivery est proposé en priorité pour la livraison, avec Paymee et Konnect en option en ligne.</p>
    <form method="post" class="form-row">
        {% csrf_token %}
        <div>
            <label for="transporteur">Transporteur</label>
            <select id="transporteur" name="transporteur" required>
                <option value="">Sélectionnez un transporteur</option>
                {% for transporteur in transporteurs %}
                    <option value="{{ transporteur.id }}">{{ transporteur.nom }} — {{ transporteur.prix_base }} TND + {{ transporteur.prix_par_kg }} TND/kg{% if transporteur.delai_estime %} ({{ transporteur.delai_estime }}){% endif %}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="provider">Fournisseur</label>
            <select id="provider" name="provider">
                <option value="cash" selected>Cash on delivery</option>
                <option value="konnect">Konnect</option>
            </select>
        </div>
        <button class="btn" type="submit">Lancer le paiement</button>
    </form>
    {% if response %}
        <div class="card card--soft">
            <h3>Réponse du fournisseur</h3>
            <pre>{{ response|safe }}</pre>
        </div>
    {% endif %}
</div>
{% endblock %}
