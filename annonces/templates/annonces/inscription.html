{% extends 'annonces/base.html' %}
{% block content %}
<div class="card">
    <h2>Inscription vendeur</h2>
    <p class="muted">Choisissez votre méthode d’identification : téléphone ou email.</p>
    <form method="post" class="form-row">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="muted">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button class="btn" type="submit">Créer mon compte</button>
    </form>
</div>
{% endblock %}
