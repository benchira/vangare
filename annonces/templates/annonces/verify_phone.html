{% extends 'annonces/base.html' %}

{% block content %}
  <h2>Vérification du téléphone</h2>
  <p>Un code de vérification a été envoyé au numéro {{ telephone }}. Entrez-le ci-dessous :</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="telephone" value="{{ telephone }}" />
    <div>
      <label for="code">Code</label>
      <input id="code" name="code" maxlength="10" />
    </div>
    <button type="submit">Vérifier</button>
  </form>
{% endblock %}
